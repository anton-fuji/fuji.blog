[build]
publish = "dist"
command = "npm run build"
# Build when no cached commit is available or the comparison cannot be made.
ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- src public astro.config.mjs package.json pnpm-lock.yaml pnpm-workspace.yaml tailwind.config.mjs tsconfig.json netlify.toml || exit 1"

[build.environment]
NODE_VERSION = "24.22.1"
