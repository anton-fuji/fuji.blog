glob_matcher: doublestar

pre-commit:
  commands:
    format:
      glob: '**/*.{css,js,mjs,ts,mdx,json,toml,yml,yaml}'
      exclude: '.codex/**'
      run: ./node_modules/.bin/oxfmt --check {staged_files}
    lint:
      glob: '**/*.{astro,js,mjs,ts}'
      run: ./node_modules/.bin/oxlint {staged_files}
